name = "application-review-portal"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID" # Generated via `wrangler d1 create portal-db`

# Cloudflare R2 Storage (For applicant photos & payment receipts)
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "portal-uploads"
