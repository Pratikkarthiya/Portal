name = "portal"
compatibility_date = "2024-11-01"

# Static assets directory for Cloudflare (HTML, CSS, images)
[assets]
directory = "./public"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "YOUR_CLOUDFLARE_D1_DATABASE_ID"

# Cloudflare R2 Storage (Optional for photos & receipts)
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "portal-uploads"
